<section class="py-16">
  <div class="container xl:w-[93%]">
    <h2 class="text-green-500 text-3xl font-medium mb-6 capitalize text-center">
      Shop All Products
    </h2>

    <!-- Search -->

    <div class="my-6 w-1/2 mx-auto">
      <input
        type="search"
        class="main-input"
        placeholder="Search By Product Name..."
        [(ngModel)]="productSearch"
      />
    </div>

    <div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
      @for (product of allProductList() | searchByTitel: productSearch; track product._id) {
        <app-card [cardProduct]="product"></app-card>
      } @empty {
        <div class="col-span-5">
          <div
            class="p-4 mt-4 text-center border-2 border-green-600 text-green-600 rounded bg-green-100"
          >
            No Products Found
          </div>
        </div>
      }
    </div>
  </div>
</section>
