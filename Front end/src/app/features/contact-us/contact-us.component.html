<section class="bg-green-600 py-20 text-center text-white">
  <h1 class="text-5xl font-bold mb-4">Contact Us</h1>

  <p class="text-green-100 text-lg">Have questions? We'd love to hear from you.</p>
</section>

<section class="py-16 bg-white">
  <div class="container grid md:grid-cols-3 gap-8">
    <div class="bg-gray-100 rounded-xl shadow p-8 text-center">
      <i class="fas fa-location-dot text-5xl text-green-600 mb-5"></i>

      <h3 class="font-bold text-2xl mb-3">Address</h3>

      <p class="text-gray-500">Cairo, Egypt</p>
    </div>

    <div class="bg-gray-100 rounded-xl shadow p-8 text-center">
      <i class="fas fa-phone text-5xl text-green-600 mb-5"></i>

      <h3 class="font-bold text-2xl mb-3">Phone</h3>

      <p class="text-gray-500">+20 100 000 0000</p>
    </div>

    <div class="bg-gray-100 rounded-xl shadow p-8 text-center">
      <i class="fas fa-envelope text-5xl text-green-600 mb-5"></i>

      <h3 class="font-bold text-2xl mb-3">Email</h3>

      <p class="text-gray-500">support@freshcart.com</p>
    </div>
  </div>
</section>

<section class="py-20 bg-gray-50">
  <div class="container max-w-3xl">
    <h2 class="text-4xl font-bold text-center mb-10">Send Us A Message</h2>

    <form class="space-y-5">
      <input class="main-input" type="text" placeholder="Your Name" />

      <input class="main-input" type="email" placeholder="Your Email" />

      <input class="main-input" type="text" placeholder="Subject" />

      <textarea rows="6" class="main-input resize-none" placeholder="Your Message"></textarea>

      <button class="btn-main w-full">Send Message</button>
    </form>
  </div>
</section>

<section class="py-16">
  <div class="container">
    <iframe
      class="w-full rounded-xl h-112.5"
      src="https://www.google.com/maps/embed?pb=..."
      loading="lazy"
    >
    </iframe>
  </div>
</section>

<section class="pb-20">
  <div class="container">
    <h2 class="text-center text-3xl font-bold mb-8">Follow Us</h2>

    <div class="flex justify-center gap-6 text-4xl">
      <a class="text-green-600 hover:scale-110 transition">
        <i class="fab fa-facebook"></i>
      </a>

      <a class="text-green-600 hover:scale-110 transition">
        <i class="fab fa-instagram"></i>
      </a>

      <a class="text-green-600 hover:scale-110 transition">
        <i class="fab fa-linkedin"></i>
      </a>

      <a class="text-green-600 hover:scale-110 transition">
        <i class="fab fa-github"></i>
      </a>
    </div>
  </div>
</section>
